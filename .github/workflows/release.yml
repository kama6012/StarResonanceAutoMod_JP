name: Release
on:
  push:
    tags: ['v*-jp.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [CPU, CUDA]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller==6.16.0
      - name: Install official NVIDIA CUDA components
        if: matrix.variant == 'CUDA'
        run: ./scripts/install_cuda.ps1
      - name: Build and verify executable
        run: ./scripts/build_release.ps1 -Variant ${{ matrix.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.variant }}
          path: package/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
      - name: Assemble upstream-style release folders
        shell: pwsh
        run: |
          $root = 'package/StarResonanceAutoMod_JP_Release_${{ github.ref_name }}'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($variant in @('CPU', 'CUDA')) {
            Move-Item -LiteralPath "artifacts/release-$variant/StarResonanceAutoMod_Release_$variant" -Destination "$root/StarResonanceAutoMod_Release_$variant"
          }
          Copy-Item README*.md $root
          Copy-Item LICENSE $root
          Copy-Item RELEASE_NOTES.md "$root/Update.txt"
          Compress-Archive -LiteralPath $root -DestinationPath 'StarResonanceAutoMod_JP_Release_${{ github.ref_name }}.zip'
          Get-FileHash 'StarResonanceAutoMod_JP_Release_${{ github.ref_name }}.zip' -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content SHA256SUMS.txt
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' 'StarResonanceAutoMod_JP_Release_${{ github.ref_name }}.zip' SHA256SUMS.txt --title 'StarResonanceAutoMod JP ${{ github.ref_name }}' --notes-file RELEASE_NOTES.md --verify-tag
