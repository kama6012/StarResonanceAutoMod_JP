name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_CPU: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Build CPU optimizer
        working-directory: cpp_extension
        run: python setup.py build_ext --inplace
      - name: Require real native extension
        run: python -c "import cpp_extension.module_optimizer_cpp"
      - run: python -m unittest discover -s tests -v
